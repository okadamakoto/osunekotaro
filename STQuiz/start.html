<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>IPA試験学習サイト</title>

    <link rel="stylesheet" href="css/styletart-container {

            max-width: 700px;

            margin: 50px auto;

            padding: 30px;

            background: white;

            border-radius: 8px;
        }

        .form-group {

            margin-bottom: 20px;
        }

        .form-group label {

            display: block;

            margin-bottom: 8px;

            font-weight: bold;
        }

        .form-group select {

            width: 100%;

            padding: 10px;

            font-size: 1rem;
        }

        #startButton {

            width: 100%;

            padding: 12px;

            font-size: 1rem;
        }

    </style>

</head>

<body>

    <div class="start-container">

        <h1>IPA試験学習サイト</h1>

        <p>
            学習する試験を選択してください。
        </p>

        <div class="form-group">

            <label for="exam">
                試験区分
            </label>

            <select id="exam">

                <option value="ST">
                    ITストラテジスト
                </option>

            </select>

        </div>

        <div class="form-group">

            <label for="year">
                年度
            </label>

            <select id="year">

                <option value="2025">
                    令和7年度（2025）
                </option>
                <option value="2024">
                    令和6年度（2024）
                </option>
                <option value="2023">
                    令和5年度（2023）
                </option>
                <option value="2022">
                    令和4年度（2022）
                </option>
                <option value="2021">
                    令和3年度（2021）
                </option>
                <option value="2019">
                    令和元年度（2019）
                </option>
                <option value="2018">
                    平成30年度（2018）
                </option>
                <option value="2017">
                    平成29年度（2017）
                </option>
                <option value="2016">
                    平成28年度（2016）
                </option>
                <option value="2015">
                    平成27年度（2015）
                </option>
                <option value="2014">
                    平成26年度（2014）
                </option>
                <option value="2013">
                    平成25年度（2013）
                </option>
                <option value="2012">
                    平成24年度（2012）
                </option>
                <option value="2011">
                    平成23年度（2011）
                </option>
                <option value="2010">
                    平成22年度（2010）
                </option>
                <option value="2009">
                    平成21年度（2009）
                </option>

            </select>

        </div>

        <div class="form-group">

            <label for="section">
                出題区分
            </label>

            <select id="section">

                <option value="AM2">
                    午前Ⅱ
                </option>

            </select>

        </div>

        <button id="startButton">
            学習開始
        </button>

    </div>

    <script>

        document
            .getElementById("startButton")
            .addEventListener(
                "click",
                function () {

                    const exam =
                        document.getElementById("exam").value;

                    const year =
                        document.getElementById("year").value;

                    const section =
                        document.getElementById("section").value;

                    const selectedExam =
                        `${exam}${year}_${section}`;

                    localStorage.setItem(
                        "selectedExam",
                        selectedExam
                    );

                    location.href =
                        "index.html";
                }
            );

    </script>

</body>

</html>
